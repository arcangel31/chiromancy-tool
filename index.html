<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Chiromancy Line Mapper</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section h2 {
            color: #667eea;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .controls {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .control-group input[type="file"],
        .control-group button,
        .control-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-group button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
        }

        .control-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .control-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-group input[type="file"]::file-selector-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        canvas {
            border: 2px solid #ddd;
            border-radius: 10px;
            max-width: 100%;
            height: auto;
            background: #f9f9f9;
            cursor: crosshair;
        }

        .canvas-container {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            position: relative;
        }

        .status {
            padding: 15px;
            background: #e8f4f8;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            color: #333;
        }

        .status.error {
            background: #fee;
            border-left-color: #f44;
            color: #c33;
        }

        .status.success {
            background: #efe;
            border-left-color: #4a4;
            color: #333;
        }

        .lines-legend {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .legend-color {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        @media (max-width: 900px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hand Chiromancy Line Mapper</h1>
            <p>Detectez et tracez les lignes de la main - Chiromancie digitale</p>
        </div>

        <div class="content">
            <div class="section">
                <h2>Controles</h2>
                <div class="controls">
                    <div class="control-group">
                        <label>Charger une photo</label>
                        <input type="file" id="imageInput" accept="image/*">
                    </div>

                    <div class="control-group">
                        <label>Couleur de dessin</label>
                        <div class="color-picker">
                            <div class="color-btn active" style="background: #ff0000;" data-color="#ff0000" title="Rouge"></div>
                            <div class="color-btn" style="background: #0000ff;" data-color="#0000ff" title="Bleu"></div>
                            <div class="color-btn" style="background: #00cc00;" data-color="#00cc00" title="Vert"></div>
                            <div class="color-btn" style="background: #ffff00;" data-color="#ffff00" title="Jaune"></div>
                            <div class="color-btn" style="background: #ff00ff;" data-color="#ff00ff" title="Magenta"></div>
                            <div class="color-btn" style="background: #00ffff;" data-color="#00ffff" title="Cyan"></div>
                            <div class="color-btn" style="background: #ffffff; border: 2px solid #999;" data-color="#ffffff" title="Blanc"></div>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Epaisseur du trait</label>
                        <input type="range" id="brushSize" min="1" max="20" value="3">
                        <small>Taille: <span id="brushSizeValue">3</span>px</small>
                    </div>

                    <div class="control-group">
                        <button id="detectBtn" disabled>Detecter les lignes</button>
                    </div>

                    <div class="control-group">
                        <button id="clearBtn">Effacer le dessin</button>
                    </div>

                    <div class="control-group">
                        <button id="exportBtn" disabled>Exporter l'image</button>
                    </div>

                    <div id="status" class="status" style="display:none;"></div>

                    <div class="lines-legend">
                        <h3 style="margin-bottom: 10px; color: #667eea;">Lignes principales</h3>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ff6b6b;"></div>
                            <span>Ligne de Vie</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #4ecdc4;"></div>
                            <span>Ligne de Tete</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #95e1d3;"></div>
                            <span>Ligne du Coeur</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ffd93d;"></div>
                            <span>Ligne de Destin</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Apercu</h2>
                <div class="canvas-container">
                    <canvas id="canvas"></canvas>
                </div>
                <div class="status success" style="display:none;" id="helpText">
                    Vous pouvez dessiner directement sur l'image avec votre souris
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageInput = document.getElementById('imageInput');
        const detectBtn = document.getElementById('detectBtn');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');
        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');
        const statusDiv = document.getElementById('status');
        const helpText = document.getElementById('helpText');

        let isDrawing = false;
        let currentColor = '#ff0000';
        let originalImage = null;
        let imageLoaded = false;

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
            });
        });

        brushSizeInput.addEventListener('input', () => {
            brushSizeValue.textContent = brushSizeInput.value;
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    originalImage = img;
                    imageLoaded = true;
                    detectBtn.disabled = false;
                    exportBtn.disabled = false;
                    helpText.style.display = 'block';
                    showStatus('Image chargee avec succes!', 'success');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!imageLoaded) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !imageLoaded) return;
            const rect = canvas.getBoundingClientRect();
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = brushSizeInput.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        });

        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        detectBtn.addEventListener('click', async () => {
            if (!originalImage) return;

            showStatus('Detection en cours...', 'success');
            detectBtn.disabled = true;

            try {
                ctx.drawImage(originalImage, 0, 0);
                drawChiromancyLines();
                showStatus('Lignes detectees! Vous pouvez les affiner au dessin', 'success');
            } catch (error) {
                showStatus('Erreur: ' + error.message, 'error');
            } finally {
                detectBtn.disabled = false;
            }
        });

        function drawChiromancyLines() {
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const w = canvas.width;
            const h = canvas.height;

            ctx.strokeStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(w * 0.3, h * 0.4, w * 0.25, Math.PI, 1.5 * Math.PI, true);
            ctx.stroke();

            ctx.strokeStyle = '#4ecdc4';
            ctx.beginPath();
            ctx.moveTo(w * 0.15, h * 0.5);
            ctx.quadraticCurveTo(w * 0.5, h * 0.45, w * 0.85, h * 0.55);
            ctx.stroke();

            ctx.strokeStyle = '#95e1d3';
            ctx.beginPath();
            ctx.moveTo(w * 0.1, h * 0.3);
            ctx.quadraticCurveTo(w * 0.5, h * 0.25, w * 0.9, h * 0.35);
            ctx.stroke();

            ctx.strokeStyle = '#ffd93d';
            ctx.beginPath();
            ctx.moveTo(w * 0.5, h * 0.6);
            ctx.lineTo(w * 0.5, h * 0.2);
            ctx.stroke();
        }

        clearBtn.addEventListener('click', () => {
            if (!originalImage) return;
            ctx.drawImage(originalImage, 0, 0);
            showStatus('Dessin efface', 'success');
        });

        exportBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'hand_chiromancy_' + new Date().getTime() + '.png';
            link.click();
            showStatus('Image exportee!', 'success');
        });

        function showStatus(message, type = 'success') {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
